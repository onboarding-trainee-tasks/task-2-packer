global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "127.0.0.1:9093"

scrape_configs:
  - job_name: "llm-node-exporter"
    ec2_sd_configs:
      - region: "eu-central-1"
        port: 9100
        refresh_interval: 60s
        filters:
          - name: instance-state-name
            values: ["running"]
          - name: tag:Role
            values: ["llm"]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Role]
        target_label: role
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance_name
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
      - source_labels: [__meta_ec2_private_ip]
        target_label: private_ip
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - source_labels: [__meta_ec2_tag_Name, __meta_ec2_instance_id]
        separator: " - "
        target_label: display_name

  - job_name: "bastion-node-exporter"
    ec2_sd_configs:
      - region: "eu-central-1"
        port: 9100
        refresh_interval: 60s
        filters:
          - name: instance-state-name
            values: ["running"]
          - name: tag:Role
            values: ["bastion"]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Role]
        target_label: role
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance_name
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id

  - job_name: "web-server-node-exporter"
    ec2_sd_configs:
      - region: "eu-central-1"
        port: 9100
        refresh_interval: 60s
        filters:
          - name: instance-state-name
            values: ["running"]
          - name: tag:Role
            values: ["web-server"]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Role]
        target_label: role
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance_name
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
